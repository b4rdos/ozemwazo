[build]
# The index HTML file to drive the bundling process
target = "index.html"
# Build in release mode
release = false
# Use a custom cargo profile. Overrides the default chosen by cargo. Ignored if the "index.html" has configured.
# cargo_profile = ""
# The output dir for all final assets
dist = "dist"
# The public URL from which assets are to be served
public_url = "/"
# Wheather to include hash values in the output files
hash = true
# Whether to inject scripts (and module preloads) inte the finalised output.
inject_scripts = true
# Run without network access
# offline = false
# Require Cargo.lock and cache are up to date
# frozen = false
# Control minification
minify = "on_release"  # can be one of: never, on_release, always
# Allow disabling sub-resource integrity (SRI) 
# no_sri = false
# An optional cargo profile to use
# cargo_profile = "release-trunk"


[watch]
# Paths to watch. The `build.target`'s parent folder is watched by default
watch = []
# Paths to ignore
ignore = []

[serve]
# The address to serve on
addresses = ["127.0.0.1"]
# The port to serve on
port = 3000
# Aliases to serve, typically found in an /etc/hosts file.
# aliases = ["http://localhost.mywebsite.com"]
# Disable the reverse DNS lookup during startup
# disable_address_lookup = false
# Open a browser tab once the initial build is complete
open = false
# Whether to disable fallback to index.html for missing files
# no_spa = false
# Disable auto-reload of the web app.
# no_autoreload = false
# Disable error reporting
# no_error_reporting = false
# Additional headers set for responses
# headers = { "test-header" = "header value", "another-header" = "another value" }
# Protocol used for autoreload WebSockets connection
# ws_protocol = "ws"
# The certificate / private key pari to use for TLS, which enabled if both are set
# tls_key_path = "self_signed_certs/key.pem"
# tls_cert_path = "self_sifned_certs/cert.pem"
# Additional header to send. NOTE: Header names must be valid HTTP headers
# headers = { "X-Foo" = "bar" }
